[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "GENERATE_A-LONG-RANDOM-SECRET"
client_id = "YOUR-GOOGLE-OIDC-CLIENT-ID"
client_secret = "YOUR-GOOGLE-OIDC-CLIENT-SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
admin_emails = ["YOUR-EMAIL@example.com"]

# Optional emergency/static allowlist. Dynamic invites are stored in Supabase.
approved_emails = []

# Persistent invite/authorization storage.
supabase_url = "https://YOUR-PROJECT.supabase.co"
supabase_service_role_key = "YOUR-SUPABASE-SERVICE-ROLE-KEY"

# Invitation email delivery.
resend_api_key = "re_YOUR-KEY"
from_email = "NFL Prediction Lab <invites@YOUR-DOMAIN.com>"
app_url = "https://YOUR-APP.streamlit.app"
