[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "GENERATE_A-LONG-RANDOM-SECRET"
client_id = "YOUR-AUTH0-CLIENT-ID"
client_secret = "YOUR-AUTH0-CLIENT-SECRET"
server_metadata_url = "https://YOUR-AUTH0-DOMAIN/.well-known/openid-configuration"

[access]
admin_emails = ["YOUR-EMAIL@example.com"]

# Optional emergency/static allowlist. Dynamic invites are stored in Supabase.
approved_emails = []

# Persistent invite/authorization storage.
supabase_url = "https://YOUR-PROJECT.supabase.co"
supabase_secret_key = "sb_secret_YOUR-SUPABASE-SECRET-KEY"

# Legacy fallback is still supported if needed:
# supabase_service_role_key = "YOUR-LEGACY-SERVICE-ROLE-KEY"

# Invitation email delivery.
app_url = "https://YOUR-APP.streamlit.app"


[invite_auth0]
domain = "YOUR-AUTH0-DOMAIN"
client_id = "YOUR-MACHINE-TO-MACHINE-CLIENT-ID"
client_secret = "YOUR-MACHINE-TO-MACHINE-SECRET"
connection = "Username-Password-Authentication"
